[project]
name = "corn-leaf-disease"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2,<2.13",
    "torchvision>=0.17,<0.28",
    "timm>=0.9,<1.1",
    "Pillow>=10.0,<13.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.4,<1.10",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<1.3",
    "tqdm>=4.66,<4.69",
    "opencv-python-headless>=4.8,<5.0",
]

[project.optional-dependencies]
dev      = ["ipykernel", "jupyterlab", "matplotlib", "seaborn", "ruff", "pyright", "pytest>=8.0,<9.0"]
analysis = ["imagededup", "fiftyone", "imageio", "mongoengine", "motor"]
cloud    = ["huggingface_hub>=0.24,<1.22", "gdown>=5.1,<6.2", "modal>=0.64"]
xai      = ["lime>=0.2", "scikit-image>=0.22", "matplotlib>=3.8"]
experiments = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
