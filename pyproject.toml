[project]
name = "maize-doctor-classifier"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4,<2.13",
    "torchvision>=0.17,<0.28",
    "timm>=0.9,<1.1",
    "Pillow>=10.0,<13.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.4,<1.10",
    "scipy>=1.11,<2",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<1.3",
    "tqdm>=4.66,<4.69",
    "opencv-python-headless>=4.8,<5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0", "ruff", "matplotlib>=3.8", "optuna>=3.6,<5.0"]
onnx = ["onnx>=1.15,<1.23", "onnxruntime>=1.17,<1.29", "onnxscript>=0.5,<0.8"]
tflite = [
    "litert-torch>=0.9,<0.10 ; sys_platform == 'linux'",
    "ai-edge-litert>=2.1,<3 ; sys_platform == 'linux'",
]
dev      = ["ipykernel", "jupyterlab", "matplotlib", "seaborn", "ruff", "pyright", "pytest>=8.0,<10.0", "optuna>=3.6,<5.0"]
segmentation = ["ultralytics==8.4.104"]
analysis = ["imagededup", "fiftyone", "imageio", "mongoengine", "motor"]
cloud    = ["huggingface_hub>=0.24,<1.22", "gdown>=5.1,<6.2", "modal>=0.64"]
xai      = ["lime>=0.2", "scikit-image>=0.22", "matplotlib>=3.8", "shap>=0.44"]
experiments = ["matplotlib>=3.8"]
tuning   = ["optuna>=3.6,<5.0", "optuna-dashboard>=0.15"]
export = [
    "onnx>=1.15,<1.23",
    "onnxruntime>=1.17,<1.29",
    "onnxscript>=0.5,<0.8",
    # TFLite via el ecosistema LiteRT. 'ai-edge-torch' quedo deprecado: sus versiones
    # >=0.7 son un stub sin API. Solo soporta Linux, de ahi el marcador de plataforma.
    "litert-torch>=0.9,<0.10 ; sys_platform == 'linux'",
    "ai-edge-litert>=2.1,<3 ; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
